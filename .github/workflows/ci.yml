name: CMSC 129 Lab 4 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Unit and Integration Tests (Jest)
        run: npm test

      - name: Run System Tests (Playwright)
        run: |
          if [ -d tests/system ] && [ "$(ls -A tests/system 2>/dev/null)" ]; then
            npm run test:system
          else
            echo "Skipping system tests because no test files exist in tests/system."
          fi
